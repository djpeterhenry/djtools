[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # third-party deprecations, not ours
    "ignore:.*CallSpec2.*",
    "ignore:.*httpx2.*",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["*.py", "tests"]
exclude = ["**/__pycache__", "song_web"]
reportMissingTypeStubs = false

# Tests index straight into results they've just checked and use partial
# records, so the Optional / not-required-key rules are noise there.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalIterable = false
reportOptionalOperand = false
reportTypedDictNotRequiredAccess = false
